name: Keep backend awake

# Backup for Learnflow.KeepAwake: if the Render free instance ever falls
# asleep (e.g. after a restart), wake it so visitors don't wait ~45 s.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --retry 3 --retry-delay 10 -m 90 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://learnflow-api-1eef.onrender.com/health
